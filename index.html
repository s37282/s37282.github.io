<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | Waranchit Portfolio</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#02030a;

    color:#fff;

    overflow:hidden;

    cursor:default;
}


/* =========================================================
   ROOT
========================================================= */

:root{

    --cyan:#35e7ff;
    --blue:#4c7dff;
    --purple:#a855f7;
    --pink:#ec49ff;

    --white:#ffffff;

}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#02030a;

    overflow:hidden;

    isolation:isolate;

}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

.space{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:-20;

    background:

        radial-gradient(
            ellipse at 50% 50%,
            rgba(48,86,255,.14),
            transparent 28%
        ),

        radial-gradient(
            ellipse at 15% 25%,
            rgba(0,220,255,.12),
            transparent 30%
        ),

        radial-gradient(
            ellipse at 85% 70%,
            rgba(168,85,247,.14),
            transparent 32%
        ),

        radial-gradient(
            ellipse at 50% 100%,
            rgba(80,30,255,.13),
            transparent 40%
        ),

        #02030a;

}


/* =========================================================
   NEBULA
========================================================= */

.nebula{

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    opacity:.5;

    pointer-events:none;

    mix-blend-mode:screen;

}


.nebula.one{

    width:600px;
    height:600px;

    left:-180px;
    top:-180px;

    background:

        radial-gradient(
            circle,
            rgba(0,217,255,.24),
            rgba(48,76,255,.08),
            transparent 70%
        );

    animation:
        nebulaFloat1 12s ease-in-out infinite alternate;

}


.nebula.two{

    width:700px;
    height:700px;

    right:-250px;
    bottom:-260px;

    background:

        radial-gradient(
            circle,
            rgba(178,63,255,.25),
            rgba(75,55,255,.08),
            transparent 70%
        );

    animation:
        nebulaFloat2 15s ease-in-out infinite alternate;

}


.nebula.three{

    width:400px;
    height:400px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:

        radial-gradient(
            circle,
            rgba(30,170,255,.12),
            rgba(150,50,255,.06),
            transparent 70%
        );

    animation:
        nebulaPulse 7s ease-in-out infinite;

}


/* =========================================================
   AURORA
========================================================= */

.aurora{

    position:absolute;

    width:100%;
    height:45%;

    left:0;
    bottom:-10%;

    opacity:.18;

    filter:blur(50px);

    background:

        linear-gradient(
            110deg,
            transparent 0%,
            rgba(0,229,255,.3) 25%,
            rgba(74,111,255,.28) 45%,
            rgba(182,73,255,.3) 70%,
            transparent 100%
        );

    transform:
        rotate(-8deg)
        scale(1.2);

    animation:
        auroraMove 12s ease-in-out infinite alternate;

}


/* =========================================================
   STAR LAYER 1
========================================================= */

.stars{

    position:absolute;

    inset:-200px;

    background-image:

        radial-gradient(1px 1px at 3% 8%,rgba(255,255,255,.85),transparent),
        radial-gradient(1px 1px at 8% 72%,rgba(120,225,255,.75),transparent),
        radial-gradient(2px 2px at 13% 35%,rgba(255,255,255,.95),transparent),
        radial-gradient(1px 1px at 18% 88%,rgba(150,200,255,.7),transparent),
        radial-gradient(1px 1px at 24% 18%,rgba(255,255,255,.85),transparent),
        radial-gradient(2px 2px at 29% 55%,rgba(110,210,255,.8),transparent),
        radial-gradient(1px 1px at 34% 7%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 39% 77%,rgba(160,130,255,.8),transparent),
        radial-gradient(2px 2px at 44% 42%,rgba(255,255,255,.95),transparent),
        radial-gradient(1px 1px at 49% 92%,rgba(100,210,255,.7),transparent),
        radial-gradient(1px 1px at 54% 13%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 59% 65%,rgba(160,120,255,.9),transparent),
        radial-gradient(1px 1px at 64% 31%,rgba(255,255,255,.75),transparent),
        radial-gradient(1px 1px at 69% 84%,rgba(100,220,255,.8),transparent),
        radial-gradient(2px 2px at 74% 8%,rgba(255,255,255,.95),transparent),
        radial-gradient(1px 1px at 79% 51%,rgba(160,130,255,.8),transparent),
        radial-gradient(1px 1px at 84% 27%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 89% 73%,rgba(100,210,255,.9),transparent),
        radial-gradient(1px 1px at 94% 17%,rgba(255,255,255,.75),transparent),
        radial-gradient(1px 1px at 97% 91%,rgba(160,130,255,.8),transparent);

    background-size:
        500px 500px;

    opacity:.65;

    animation:
        starsDrift 45s linear infinite;

}


/* =========================================================
   STAR LAYER 2
========================================================= */

.stars-2{

    position:absolute;

    inset:-250px;

    background-image:

        radial-gradient(2px 2px at 7% 22%,rgba(80,220,255,.85),transparent),
        radial-gradient(1px 1px at 17% 68%,rgba(255,255,255,.55),transparent),
        radial-gradient(1px 1px at 27% 42%,rgba(120,160,255,.7),transparent),
        radial-gradient(2px 2px at 37% 82%,rgba(190,100,255,.8),transparent),
        radial-gradient(1px 1px at 47% 24%,rgba(255,255,255,.6),transparent),
        radial-gradient(2px 2px at 57% 57%,rgba(80,220,255,.8),transparent),
        radial-gradient(1px 1px at 67% 12%,rgba(255,255,255,.65),transparent),
        radial-gradient(2px 2px at 77% 76%,rgba(170,90,255,.8),transparent),
        radial-gradient(1px 1px at 87% 38%,rgba(100,190,255,.6),transparent),
        radial-gradient(2px 2px at 97% 62%,rgba(255,255,255,.8),transparent);

    background-size:
        700px 700px;

    opacity:.45;

    animation:
        starsDriftReverse 65s linear infinite;

}


/* =========================================================
   STAR GLOW
========================================================= */

.stars-3{

    position:absolute;

    inset:0;

    background-image:

        radial-gradient(
            3px 3px at 20% 20%,
            rgba(0,225,255,.95),
            transparent
        ),

        radial-gradient(
            3px 3px at 80% 30%,
            rgba(170,90,255,.9),
            transparent
        ),

        radial-gradient(
            3px 3px at 65% 80%,
            rgba(255,255,255,.95),
            transparent
        ),

        radial-gradient(
            3px 3px at 35% 65%,
            rgba(80,200,255,.9),
            transparent
        );

    animation:
        starTwinkle 4s ease-in-out infinite alternate;

    opacity:.5;

}


/* =========================================================
   PARTICLES
========================================================= */

.particles{

    position:absolute;

    inset:0;

    pointer-events:none;

}


.particle{

    position:absolute;

    width:2px;

    height:2px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px rgba(100,220,255,.9);

    opacity:.6;

    animation:
        particleFloat var(--duration) linear infinite;

    animation-delay:
        var(--delay);

}


/* =========================================================
   GRID
========================================================= */

.grid{

    position:absolute;

    left:-20%;

    right:-20%;

    bottom:-38%;

    height:75%;

    background-image:

        linear-gradient(
            rgba(50,150,255,.08) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,150,255,.08) 1px,
            transparent 1px
        );

    background-size:
        65px 65px;

    transform:
        perspective(500px)
        rotateX(63deg);

    transform-origin:center top;

    mask-image:
        linear-gradient(
            to top,
            black,
            transparent
        );

    -webkit-mask-image:
        linear-gradient(
            to top,
            black,
            transparent
        );

    opacity:.5;

    animation:
        gridMove 12s linear infinite;

}


/* =========================================================
   CENTER ENERGY
========================================================= */

.energy-core{

    position:absolute;

    width:420px;
    height:420px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(100,180,255,.13),
            rgba(120,50,255,.06) 35%,
            transparent 70%
        );

    filter:blur(5px);

    animation:
        corePulse 5s ease-in-out infinite;

}


/* =========================================================
   ORBITS
========================================================= */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid rgba(90,210,255,.18);

    border-radius:50%;

    pointer-events:none;

}


.orbit.one{

    width:520px;
    height:180px;

    transform:
        translate(-50%,-50%)
        rotate(-20deg);

    box-shadow:
        0 0 25px rgba(30,200,255,.08);

    animation:
        orbitSpin 12s linear infinite;

}


.orbit.two{

    width:620px;
    height:220px;

    transform:
        translate(-50%,-50%)
        rotate(55deg);

    border-color:
        rgba(160,90,255,.15);

    animation:
        orbitSpinReverse 17s linear infinite;

}


.orbit.three{

    width:760px;
    height:280px;

    transform:
        translate(-50%,-50%)
        rotate(78deg);

    border-color:
        rgba(70,130,255,.08);

    animation:
        orbitSpin 24s linear infinite;

}


/* =========================================================
   ORBIT DOT
========================================================= */

.orbit::after{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:50%;
    left:0;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        var(--cyan);

    box-shadow:

        0 0 10px var(--cyan),
        0 0 25px var(--cyan),
        0 0 45px rgba(53,231,255,.7);

}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.2) 60%,
            rgba(0,0,0,.82) 100%
        );

    pointer-events:none;

    z-index:2;

}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:20;

    opacity:.09;

    background:

        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );

    animation:
        scanMove 8s linear infinite;

}


/* =========================================================
   CENTER CONTENT
========================================================= */

.loading-content{

    position:relative;

    z-index:10;

    width:90%;

    max-width:1100px;

    text-align:center;

    perspective:1200px;

}


/* =========================================================
   TOP LABEL
========================================================= */

.small-text{

    font-size:11px;

    letter-spacing:9px;

    color:#9ca9c9;

    margin-bottom:30px;

    opacity:0;

    filter:blur(8px);

    transform:
        translateY(25px);

    animation:

        nameReveal
        1.2s
        cubic-bezier(.16,1,.3,1)
        .2s
        forwards;

}


.small-text::before{

    content:"◆";

    color:var(--cyan);

    margin-right:12px;

    text-shadow:
        0 0 12px var(--cyan);

}


.small-text::after{

    content:"◆";

    color:var(--purple);

    margin-left:12px;

    text-shadow:
        0 0 12px var(--purple);

}


/* =========================================================
   TITLE
========================================================= */

.title{

    position:relative;

    font-size:

        clamp(
            45px,
            8vw,
            105px
        );

    font-weight:700;

    line-height:.92;

    letter-spacing:-5px;

    text-transform:uppercase;

    opacity:0;

    filter:blur(14px);

    transform:
        translateY(45px)
        scale(.94);

    animation:

        titleReveal
        1.6s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;

}


/* =========================================================
   TITLE GLOW
========================================================= */

.title::before{

    content:"WELCOME TO";

    position:absolute;

    inset:0;

    color:transparent;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(70,200,255,.22),
            rgba(170,80,255,.22),
            transparent
        );

    background-size:250% 100%;

    -webkit-background-clip:text;

    background-clip:text;

    filter:blur(16px);

    opacity:.7;

    animation:
        titleGlow 5s ease-in-out 2s infinite;

}


/* =========================================================
   SECOND LINE
========================================================= */

.title span{

    display:block;

    position:relative;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(255,255,255,.9);

    text-shadow:
        0 0 20px rgba(70,180,255,.08);

    animation:
        titleBreathing 5s ease-in-out 2.5s infinite;

}


/* =========================================================
   SECOND LINE GRADIENT
========================================================= */

.title span::before{

    content:"MY PORTFOLIO";

    position:absolute;

    inset:0;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(90,210,255,.25);

    background:

        linear-gradient(
            100deg,
            transparent 10%,
            rgba(50,220,255,.8) 40%,
            rgba(170,80,255,.9) 55%,
            transparent 80%
        );

    background-size:
        250% 100%;

    -webkit-background-clip:text;

    background-clip:text;

    filter:
        drop-shadow(
            0 0 15px rgba(50,190,255,.25)
        );

    animation:
        textShine 4.5s ease-in-out 3s infinite;

}


/* =========================================================
   TEXT GLITCH
========================================================= */

.title span::after{

    content:"MY PORTFOLIO";

    position:absolute;

    inset:0;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(255,255,255,.12);

    clip-path:
        polygon(
            0 35%,
            100% 35%,
            100% 43%,
            0 43%
        );

    transform:
        translateX(-5px);

    opacity:.7;

    animation:
        glitch 4s infinite;

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin-top:32px;

    font-size:12px;

    letter-spacing:6px;

    color:#8e9ab3;

    text-transform:uppercase;

    opacity:0;

    filter:blur(7px);

    transform:
        translateY(20px);

    animation:

        subtitleReveal
        1.1s
        cubic-bezier(.16,1,.3,1)
        1.7s
        forwards;

}


/* =========================================================
   DECORATIVE LINE
========================================================= */

.line{

    position:relative;

    width:0;

    height:1px;

    margin:
        35px auto 30px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            #fff,
            var(--purple),
            transparent
        );

    box-shadow:

        0 0 10px rgba(50,220,255,.7),
        0 0 30px rgba(150,80,255,.35);

    animation:
        lineGrow 1.3s ease 2.3s forwards;

}


.line::before,
.line::after{

    content:"";

    position:absolute;

    top:50%;

    width:5px;
    height:5px;

    border-radius:50%;

    transform:
        translateY(-50%);

    background:
        var(--cyan);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 20px var(--cyan);

}


.line::before{
    left:0;
}


.line::after{

    right:0;

    background:
        var(--purple);

    box-shadow:
        0 0 10px var(--purple),
        0 0 20px var(--purple);

}


/* =========================================================
   LOADING TEXT
========================================================= */

.loading-text{

    font-size:10px;

    letter-spacing:5px;

    color:#75809a;

    text-transform:uppercase;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        loadingFade .9s ease 2.6s forwards;

}


.loading-text::after{

    content:"";

    display:inline-block;

    width:22px;

    text-align:left;

    animation:
        dots 1.2s steps(4,end) infinite;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    position:relative;

    width:320px;

    max-width:75%;

    height:4px;

    margin:
        18px auto 0;

    opacity:0;

    animation:
        loadingFade .9s ease 2.6s forwards;

}


.progress{

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.04),
            rgba(80,100,160,.12)
        );

    border:
        1px solid rgba(255,255,255,.08);

    overflow:hidden;

    border-radius:20px;

}


.progress::after{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:0;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #286dff,
            #24d9ff,
            #fff,
            #b54cff
        );

    box-shadow:

        0 0 8px rgba(40,170,255,.8),
        0 0 20px rgba(80,100,255,.55),
        0 0 35px rgba(180,70,255,.25);

    animation:
        progressLoad 3.2s
        cubic-bezier(.4,0,.2,1)
        2.7s
        forwards;

}


.progress::before{

    content:"";

    position:absolute;

    top:0;

    left:-100px;

    width:80px;

    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    filter:
        blur(1px);

    animation:
        progressShine 1.5s linear infinite;

}


/* =========================================================
   PERCENT
========================================================= */

.percent{

    margin-top:15px;

    font-size:9px;

    color:#59637a;

    letter-spacing:4px;

    opacity:0;

    animation:
        loadingFade .9s ease 2.6s forwards;

}


#percentNumber{

    color:#b9c8e7;

    display:inline-block;

    min-width:35px;

}


/* =========================================================
   SYSTEM STATUS
========================================================= */

.system-status{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    margin-top:22px;

    font-size:8px;

    letter-spacing:3px;

    color:#4f5b73;

    opacity:0;

    animation:
        loadingFade 1s ease 2.8s forwards;

}


.status-dot{

    width:5px;
    height:5px;

    border-radius:50%;

    background:
        var(--cyan);

    box-shadow:

        0 0 8px var(--cyan),
        0 0 16px rgba(53,231,255,.8);

    animation:
        statusPulse 1.5s ease-in-out infinite;

}


/* =========================================================
   CORNERS
========================================================= */

.corner{

    position:absolute;

    width:60px;

    height:60px;

    border-color:
        rgba(100,180,255,.35);

    border-style:solid;

    opacity:.8;

    z-index:15;

    transition:
        .5s ease;

}


.corner::after{

    content:"";

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:
        var(--cyan);

    box-shadow:
        0 0 10px var(--cyan);

}


.corner.top-left{

    top:30px;
    left:30px;

    border-width:
        1px 0 0 1px;

}


.corner.top-left::after{

    left:-3px;
    top:-3px;

}


.corner.top-right{

    top:30px;
    right:30px;

    border-width:
        1px 1px 0 0;

}


.corner.top-right::after{

    right:-3px;
    top:-3px;

    background:
        var(--purple);

    box-shadow:
        0 0 10px var(--purple);

}


.corner.bottom-left{

    bottom:30px;
    left:30px;

    border-width:
        0 0 1px 1px;

}


.corner.bottom-left::after{

    left:-3px;
    bottom:-3px;

}


.corner.bottom-right{

    bottom:30px;
    right:30px;

    border-width:
        0 1px 1px 0;

}


.corner.bottom-right::after{

    right:-3px;
    bottom:-3px;

    background:
        var(--purple);

    box-shadow:
        0 0 10px var(--purple);

}


/* =========================================================
   TOP INFO
========================================================= */

.top-info{

    position:absolute;

    top:35px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:6px;

    color:#46516a;

    white-space:nowrap;

    z-index:16;

    opacity:0;

    animation:
        simpleFade 1s ease 1s forwards;

}


.top-info::before{

    content:"";

    display:inline-block;

    width:28px;

    height:1px;

    margin:
        0 12px 3px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan)
        );

}


.top-info::after{

    content:"";

    display:inline-block;

    width:28px;

    height:1px;

    margin:
        0 0 3px 12px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            transparent
        );

}


/* =========================================================
   BOTTOM INFO
========================================================= */

.bottom-info{

    position:absolute;

    bottom:35px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:8px;

    letter-spacing:4px;

    color:#3f4960;

    white-space:nowrap;

    z-index:16;

    opacity:0;

    animation:
        simpleFade 1s ease 1.2s forwards;

}


/* =========================================================
   EXIT
========================================================= */

.loading-screen.exit{

    animation:

        exitScreen
        1.3s
        cubic-bezier(.76,0,.24,1)
        forwards;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes nameReveal{

    0%{

        opacity:0;

        filter:blur(10px);

        transform:
            translateY(25px);

        letter-spacing:18px;

    }

    100%{

        opacity:1;

        filter:blur(0);

        transform:
            translateY(0);

        letter-spacing:9px;

    }

}


@keyframes titleReveal{

<body>


<section
    class="loading-screen"
    id="loadingScreen"
>


    <!-- =====================================================
         SPACE
    ====================================================== -->

    <div class="space">

        <div class="nebula one"></div>

        <div class="nebula two"></div>

        <div class="nebula three"></div>

        <div class="aurora"></div>

        <div class="stars"></div>

        <div class="stars-2"></div>

        <div class="stars-3"></div>

        <div class="particles" id="particles"></div>

        <div class="energy-core"></div>

        <div class="orbit one"></div>

        <div class="orbit two"></div>

        <div class="orbit three"></div>

        <div class="grid"></div>

    </div>


    <!-- =====================================================
         VIGNETTE
    ====================================================== -->

    <div class="vignette"></div>


    <!-- =====================================================
         SCANLINES
    ====================================================== -->

    <div class="scanlines"></div>


    <!-- =====================================================
         CORNERS
    ====================================================== -->

    <div class="corner top-left"></div>

    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>

    <div class="corner bottom-right"></div>


    <!-- =====================================================
         TOP INFO
    ====================================================== -->

    <div class="top-info">

        PORTFOLIO • 2026

    </div>


    <!-- =====================================================
         CENTER
    ====================================================== -->

    <div class="loading-content">


        <div class="small-text">

            WARANCHIT WONGSUPALERD

        </div>


        <div class="title">

            WELCOME TO

            <span>

                MY PORTFOLIO

            </span>

        </div>


        <div class="subtitle">

            WELCOME TO MY PORTFOLIO WEBSITE

        </div>


        <div class="line"></div>


        <div class="loading-text">

            INITIALIZING PORTFOLIO

        </div>


        <div class="progress-wrap">

            <div class="progress"></div>

        </div>


        <div class="percent">

            <span id="percentNumber">0%</span>

            • SYSTEM READY

        </div>


        <div class="system-status">

            <span class="status-dot"></span>

            ESTABLISHING CONNECTION

            <span class="status-dot"></span>

        </div>


    </div>


    <!-- =====================================================
         BOTTOM
    ====================================================== -->

    <div class="bottom-info">

        WARANCHIT © 2026 • DIGITAL EXPERIENCE

    </div>


</section>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const loadingScreen =
    document.getElementById("loadingScreen");

const percentNumber =
    document.getElementById("percentNumber");

const particles =
    document.getElementById("particles");


/* =========================================================
   PARTICLES
========================================================= */

const reduceMotion =
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;


if(!reduceMotion){

    const particleCount =
        window.innerWidth < 600
        ? 28
        : 55;


    for(let i = 0; i < particleCount; i++){

        const particle =
            document.createElement("span");


        particle.className =
            "particle";


        const size =
            Math.random() > .85
            ? 3
            : 1 + Math.random();


        const duration =
            8 + Math.random() * 15;


        const delay =
            Math.random() * -20;


        const drift =
            (Math.random() * 180 - 90) + "px";


        particle.style.width =
            size + "px";


        particle.style.height =
            size + "px";


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.top =
            "0";


        particle.style.setProperty(
            "--duration",
            duration + "s"
        );


        particle.style.setProperty(
            "--delay",
            delay + "s"
        );


        particle.style.setProperty(
            "--drift",
            drift
        );


        particle.style.opacity =
            .2 + Math.random() * .7;


        particles.appendChild(
            particle
        );

    }

}


/* =========================================================
   LOADING PERCENT
========================================================= */

let progress = 0;

const startTime =
    performance.now();


const duration =
    5000;


function updateProgress(){

    const now =
        performance.now();


    const elapsed =
        now - startTime;


    let value =
        Math.min(
            elapsed / duration,
            1
        );


    /*
       easing
    */

    value =
        1 -
        Math.pow(
            1 - value,
            1.35
        );


    progress =
        Math.floor(
            value * 100
        );


    percentNumber.textContent =
        progress + "%";


    if(progress < 100){

        requestAnimationFrame(
            updateProgress
        );

    }

}


updateProgress();


/* =========================================================
   MOUSE PARALLAX
========================================================= */

if(!reduceMotion && window.innerWidth > 800){

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    window.addEventListener(
        "mousemove",
        (event) => {

            targetX =
                (event.clientX /
                window.innerWidth -
                .5) * 2;


            targetY =
                (event.clientY /
                window.innerHeight -
                .5) * 2;

        }
    );


    function parallax(){

        currentX +=
            (targetX - currentX) * .035;


        currentY +=
            (targetY - currentY) * .035;


        const content =
            document.querySelector(
                ".loading-content"
            );


        const energy =
            document.querySelector(
                ".energy-core"
            );


        if(content){

            content.style.transform =
                `translate3d(
                    ${currentX * 7}px,
                    ${currentY * 5}px,
                    0
                )`;

        }


        if(energy){

            energy.style.marginLeft =
                `${currentX * 12}px`;

            energy.style.marginTop =
                `${currentY * 12}px`;

        }


        requestAnimationFrame(
            parallax
        );

    }


    parallax();

}


/* =========================================================
   EXIT
========================================================= */

setTimeout(() => {

    loadingScreen.classList.add(
        "exit"
    );

}, 5900);


/* =========================================================
   GO TO PORTFOLIO
========================================================= */

setTimeout(() => {

    window.location.href =
        "portfolio.html";

}, 7200);


/* =========================================================
   FALLBACK CLICK
========================================================= */

loadingScreen.addEventListener(
    "click",
    () => {

        if(
            progress >= 85
        ){

            loadingScreen.classList.add(
                "exit"
            );


            setTimeout(() => {

                window.location.href =
                    "portfolio.html";

            }, 900);

        }

    }
);

</script>


</body>

</html>
