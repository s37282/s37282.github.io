<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | Waranchit Portfolio</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#050505;

    color:#fff;

    overflow:hidden;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.09),
            transparent 32%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(255,255,255,.035),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 20%,
            rgba(255,255,255,.035),
            transparent 30%
        ),

        #050505;

    overflow:hidden;
}


/* =========================================================
   BACKGROUND GRID
========================================================= */

.loading-screen::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,
            transparent 49.5%,
            rgba(255,255,255,.035) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            transparent 49.5%,
            rgba(255,255,255,.035) 50%,
            transparent 50.5%
        );

    background-size:
        100px 100px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            transparent 75%
        );

    opacity:.5;

    pointer-events:none;
}


/* =========================================================
   NOISE
========================================================= */

.loading-screen::after{

    content:"";

    position:absolute;

    inset:0;

    opacity:.035;

    pointer-events:none;

    background-image:

        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
}


/* =========================================================
   CENTER
========================================================= */

.loading-content{

    position:relative;

    z-index:5;

    width:90%;

    max-width:1000px;

    text-align:center;
}


/* =========================================================
   SMALL TEXT
========================================================= */

.small-text{

    font-size:11px;

    letter-spacing:8px;

    color:#777;

    margin-bottom:28px;

    opacity:0;

    animation:
        fadeUp .9s ease .3s forwards;
}


/* =========================================================
   MAIN TITLE
========================================================= */

.title{

    font-size:
        clamp(
            42px,
            8vw,
            100px
        );

    font-weight:700;

    line-height:.95;

    letter-spacing:-4px;

    text-transform:uppercase;

    opacity:0;

    animation:
        titleReveal 1.3s
        cubic-bezier(.16,1,.3,1)
        .7s
        forwards;
}


.title span{

    display:block;

    color:#050505;

    -webkit-text-stroke:
        1px #fff;

    text-shadow:

        0 0 25px
        rgba(255,255,255,.1),

        0 0 60px
        rgba(255,255,255,.05);
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin-top:30px;

    font-size:13px;

    letter-spacing:5px;

    color:#999;

    text-transform:uppercase;

    opacity:0;

    animation:
        fadeUp .9s ease 1.9s forwards;
}


/* =========================================================
   LINE
========================================================= */

.line{

    width:0;

    height:1px;

    background:#fff;

    margin:
        35px auto 30px;

    animation:
        lineGrow 1.2s ease 2.5s forwards;
}


/* =========================================================
   LOADING TEXT
========================================================= */

.loading-text{

    font-size:10px;

    letter-spacing:4px;

    color:#666;

    text-transform:uppercase;

    opacity:0;

    animation:
        fadeIn .7s ease 2.8s forwards;
}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress{

    width:260px;

    max-width:70%;

    height:2px;

    background:#222;

    margin:
        18px auto 0;

    overflow:hidden;

    position:relative;

    opacity:0;

    animation:
        fadeIn .7s ease 2.8s forwards;
}


.progress::after{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:0;

    height:100%;

    background:#fff;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.6);

    animation:
        loading 3s
        cubic-bezier(.4,0,.2,1)
        2.9s
        forwards;
}


/* =========================================================
   PERCENT
========================================================= */

.percent{

    margin-top:15px;

    font-size:10px;

    color:#555;

    letter-spacing:3px;

    opacity:0;

    animation:
        fadeIn .7s ease 2.8s forwards;
}


/* =========================================================
   CORNERS
========================================================= */

.corner{

    position:absolute;

    width:45px;

    height:45px;

    border-color:#444;

    border-style:solid;

    opacity:.6;
}


.corner.top-left{

    top:30px;

    left:30px;

    border-width:
        1px 0 0 1px;
}


.corner.top-right{

    top:30px;

    right:30px;

    border-width:
        1px 1px 0 0;
}


.corner.bottom-left{

    bottom:30px;

    left:30px;

    border-width:
        0 0 1px 1px;
}


.corner.bottom-right{

    bottom:30px;

    right:30px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   TOP / BOTTOM INFO
========================================================= */

.top-info{

    position:absolute;

    top:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:5px;

    color:#444;
}


.bottom-info{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:4px;

    color:#444;

    white-space:nowrap;
}


/* =========================================================
   EXIT
========================================================= */

.loading-screen.exit{

    animation:
        exitScreen 1s
        cubic-bezier(.76,0,.24,1)
        forwards;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(25px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


@keyframes titleReveal{

    from{

        opacity:0;

        transform:
            translateY(50px);

        letter-spacing:15px;
    }

    to{

        opacity:1;

        transform:
            translateY(0);

        letter-spacing:-4px;
    }
}


@keyframes lineGrow{

    from{
        width:0;
    }

    to{
        width:180px;
    }
}


@keyframes loading{

    from{
        width:0;
    }

    to{
        width:100%;
    }
}


@keyframes exitScreen{

    0%{

        opacity:1;

        transform:
            scale(1);
    }

    100%{

        opacity:0;

        transform:
            scale(1.06);

        visibility:hidden;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .small-text{

        font-size:9px;

        letter-spacing:5px;

        margin-bottom:22px;
    }


    .title{

        font-size:40px;

        letter-spacing:-2px;
    }


    .subtitle{

        font-size:9px;

        letter-spacing:3px;

        line-height:1.8;
    }


    .loading-text{

        font-size:8px;

        letter-spacing:3px;
    }


    .progress{

        width:220px;
    }


    .corner{

        width:30px;

        height:30px;
    }


    .corner.top-left,
    .corner.top-right{

        top:20px;
    }


    .corner.bottom-left,
    .corner.bottom-right{

        bottom:20px;
    }


    .corner.top-left,
    .corner.bottom-left{

        left:20px;
    }


    .corner.top-right,
    .corner.bottom-right{

        right:20px;
    }


    .top-info{

        top:22px;

        font-size:7px;

        letter-spacing:3px;
    }


    .bottom-info{

        bottom:22px;

        font-size:7px;

        letter-spacing:2px;
    }

}


@media(max-width:400px){

    .title{

        font-size:32px;
    }


    .subtitle{

        font-size:8px;
    }


    .progress{

        width:180px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING SCREEN
========================================================= -->

<section class="loading-screen" id="loadingScreen">


    <!-- CORNERS -->

    <div class="corner top-left"></div>

    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>

    <div class="corner bottom-right"></div>


    <!-- TOP -->

    <div class="top-info">

        PORTFOLIO • 2026

    </div>


    <!-- CENTER -->

    <div class="loading-content">


        <div class="small-text">

            WARANCHIT WONGSUPALERD

        </div>


        <div class="title">

            WELCOME TO

            <span>

                MY PORTFOLIO

            </span>

        </div>


        <div class="subtitle">

            WELCOME TO MY PORTFOLIO WEBSITE

        </div>


        <div class="line"></div>


        <div class="loading-text">

            LOADING PORTFOLIO

        </div>


        <div class="progress"></div>


        <div class="percent">

            PLEASE WAIT...

        </div>


    </div>


    <!-- BOTTOM -->

    <div class="bottom-info">

        WARANCHIT © 2026

    </div>


</section>


<script>

/* =========================================================
   AUTO REDIRECT
========================================================= */

const loadingScreen =
    document.getElementById("loadingScreen");


/*
    รอให้ Animation โหลดเสร็จ
    แล้วเปลี่ยนไปหน้า portfolio.html
*/

setTimeout(() => {

    loadingScreen.classList.add("exit");

}, 5900);


/*
    หลังจากหน้า Loading เริ่มหาย
    ให้เปิด portfolio.html อัตโนมัติ
*/

setTimeout(() => {

    window.location.href = "portfolio.html";

}, 6900);

</script>


</body>

</html>
