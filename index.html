
<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | Waranchit Portfolio</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#000;

    color:#fff;

    overflow:hidden;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#000;

    overflow:hidden;

    isolation:isolate;
}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

.space{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:-10;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.055),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,.025),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,.025),
            transparent 30%
        ),

        #000;
}


/* =========================================================
   STAR LAYERS
========================================================= */

.stars{

    position:absolute;

    inset:-200px;

    background-image:

        radial-gradient(1px 1px at 3% 8%,rgba(255,255,255,.8),transparent),
        radial-gradient(1px 1px at 8% 72%,rgba(255,255,255,.7),transparent),
        radial-gradient(2px 2px at 13% 35%,rgba(255,255,255,.9),transparent),
        radial-gradient(1px 1px at 18% 88%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 24% 18%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 29% 55%,rgba(255,255,255,.8),transparent),
        radial-gradient(1px 1px at 34% 7%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 39% 77%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 44% 42%,rgba(255,255,255,.9),transparent),
        radial-gradient(1px 1px at 49% 92%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 54% 13%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 59% 65%,rgba(255,255,255,.9),transparent),
        radial-gradient(1px 1px at 64% 31%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 69% 84%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 74% 8%,rgba(255,255,255,.9),transparent),
        radial-gradient(1px 1px at 79% 51%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 84% 27%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 89% 73%,rgba(255,255,255,.9),transparent),
        radial-gradient(1px 1px at 94% 17%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 97% 91%,rgba(255,255,255,.8),transparent);

    background-size:
        500px 500px;

    opacity:.65;

    animation:
        starsDrift 45s linear infinite;
}


/* =========================================================
   SECOND STAR LAYER
========================================================= */

.stars-2{

    position:absolute;

    inset:-250px;

    background-image:

        radial-gradient(2px 2px at 7% 22%,rgba(255,255,255,.75),transparent),
        radial-gradient(1px 1px at 17% 68%,rgba(255,255,255,.5),transparent),
        radial-gradient(1px 1px at 27% 42%,rgba(255,255,255,.6),transparent),
        radial-gradient(2px 2px at 37% 82%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 47% 24%,rgba(255,255,255,.55),transparent),
        radial-gradient(2px 2px at 57% 57%,rgba(255,255,255,.75),transparent),
        radial-gradient(1px 1px at 67% 12%,rgba(255,255,255,.6),transparent),
        radial-gradient(2px 2px at 77% 76%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 87% 38%,rgba(255,255,255,.55),transparent),
        radial-gradient(2px 2px at 97% 62%,rgba(255,255,255,.75),transparent);

    background-size:
        700px 700px;

    opacity:.4;

    animation:
        starsDriftReverse 65s linear infinite;
}


/* =========================================================
   STAR GLOW
========================================================= */

.stars-3{

    position:absolute;

    inset:0;

    background-image:

        radial-gradient(
            2px 2px at 20% 20%,
            rgba(255,255,255,.9),
            transparent
        ),

        radial-gradient(
            2px 2px at 80% 30%,
            rgba(255,255,255,.8),
            transparent
        ),

        radial-gradient(
            2px 2px at 65% 80%,
            rgba(255,255,255,.9),
            transparent
        ),

        radial-gradient(
            2px 2px at 35% 65%,
            rgba(255,255,255,.8),
            transparent
        );

    animation:
        starTwinkle 4s ease-in-out infinite alternate;

    opacity:.5;
}


/* =========================================================
   SOFT SPACE LIGHT
========================================================= */

.space-light{

    position:absolute;

    width:650px;

    height:650px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.035),
            transparent 65%
        );

    filter:blur(30px);

    animation:
        spacePulse 7s ease-in-out infinite;
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.35) 70%,
            rgba(0,0,0,.9) 100%
        );

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   CONTENT
========================================================= */

.loading-content{

    position:relative;

    z-index:5;

    width:90%;

    max-width:1100px;

    text-align:center;

    perspective:1000px;
}


/* =========================================================
   NAME
========================================================= */

.small-text{

    font-size:11px;

    letter-spacing:9px;

    color:#888;

    margin-bottom:30px;

    opacity:0;

    filter:blur(8px);

    transform:
        translateY(20px);

    animation:

        nameReveal
        1.2s
        cubic-bezier(.16,1,.3,1)
        .2s
        forwards;
}


/* =========================================================
   TITLE
========================================================= */

.title{

    font-size:

        clamp(
            45px,
            8vw,
            105px
        );

    font-weight:700;

    line-height:.92;

    letter-spacing:-5px;

    text-transform:uppercase;

    opacity:0;

    filter:blur(14px);

    transform:
        translateY(45px)
        scale(.94);

    animation:

        titleReveal
        1.6s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;
}


/* =========================================================
   TITLE SECOND LINE
========================================================= */

.title span{

    display:block;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(255,255,255,.9);

    position:relative;

    animation:
        titleBreathing 5s ease-in-out 2.5s infinite;
}


/* =========================================================
   TEXT SHINE
========================================================= */

.title span::after{

    content:"MY PORTFOLIO";

    position:absolute;

    inset:0;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(255,255,255,.15);

    background:

        linear-gradient(
            110deg,
            transparent 35%,
            rgba(255,255,255,.8) 50%,
            transparent 65%
        );

    background-size:
        250% 100%;

    -webkit-background-clip:text;

    background-clip:text;

    animation:
        textShine 5s ease-in-out 3s infinite;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin-top:32px;

    font-size:12px;

    letter-spacing:6px;

    color:#888;

    text-transform:uppercase;

    opacity:0;

    filter:blur(7px);

    transform:
        translateY(20px);

    animation:

        subtitleReveal
        1.1s
        cubic-bezier(.16,1,.3,1)
        1.7s
        forwards;
}


/* =========================================================
   LINE
========================================================= */

.line{

    position:relative;

    width:0;

    height:1px;

    margin:
        35px auto 30px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #fff,
            transparent
        );

    box-shadow:
        0 0 15px rgba(255,255,255,.6);

    animation:
        lineGrow 1.3s ease 2.3s forwards;
}


/* =========================================================
   LOADING TEXT
========================================================= */

.loading-text{

    font-size:10px;

    letter-spacing:5px;

    color:#666;

    text-transform:uppercase;

    opacity:0;

    transform:
        translateY(10px);

    animation:
        loadingFade .9s ease 2.6s forwards;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    position:relative;

    width:280px;

    max-width:70%;

    height:2px;

    background:#1a1a1a;

    margin:
        18px auto 0;

    overflow:hidden;

    opacity:0;

    animation:
        loadingFade .9s ease 2.6s forwards;
}


.progress::after{

    content:"";

    position:absolute;

    inset:0;

    width:0;

    background:#fff;

    box-shadow:
        0 0 15px rgba(255,255,255,.9);

    animation:
        progressLoad 3.1s
        cubic-bezier(.4,0,.2,1)
        2.7s
        forwards;
}


/* =========================================================
   PROGRESS SHINE
========================================================= */

.progress::before{

    content:"";

    position:absolute;

    top:0;

    left:-80px;

    width:70px;

    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    animation:
        progressShine 1.8s linear infinite;
}


/* =========================================================
   WAIT TEXT
========================================================= */

.percent{

    margin-top:15px;

    font-size:9px;

    color:#555;

    letter-spacing:4px;

    opacity:0;

    animation:
        loadingFade .9s ease 2.6s forwards;
}


/* =========================================================
   CORNERS
========================================================= */

.corner{

    position:absolute;

    width:48px;

    height:48px;

    border-color:#333;

    border-style:solid;

    opacity:.6;

    z-index:6;

    transition:
        .5s ease;
}


.corner.top-left{

    top:30px;
    left:30px;

    border-width:
        1px 0 0 1px;
}


.corner.top-right{

    top:30px;
    right:30px;

    border-width:
        1px 1px 0 0;
}


.corner.bottom-left{

    bottom:30px;
    left:30px;

    border-width:
        0 0 1px 1px;
}


.corner.bottom-right{

    bottom:30px;
    right:30px;

    border-width:
        0 1px 1px 0;
}


/* =========================================================
   TOP INFO
========================================================= */

.top-info{

    position:absolute;

    top:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:6px;

    color:#444;

    white-space:nowrap;

    z-index:6;

    opacity:0;

    animation:
        simpleFade 1s ease 1s forwards;
}


/* =========================================================
   BOTTOM INFO
========================================================= */

.bottom-info{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:4px;

    color:#444;

    white-space:nowrap;

    z-index:6;

    opacity:0;

    animation:
        simpleFade 1s ease 1.2s forwards;
}


/* =========================================================
   EXIT
========================================================= */

.loading-screen.exit{

    animation:

        exitScreen
        1.2s
        cubic-bezier(.76,0,.24,1)
        forwards;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes nameReveal{

    0%{

        opacity:0;

        filter:blur(10px);

        transform:
            translateY(25px);

        letter-spacing:18px;
    }

    100%{

        opacity:1;

        filter:blur(0);

        transform:
            translateY(0);

        letter-spacing:9px;
    }
}


@keyframes titleReveal{

    0%{

        opacity:0;

        filter:blur(14px);

        transform:
            translateY(50px)
            scale(.94);

        letter-spacing:15px;
    }

    100%{

        opacity:1;

        filter:blur(0);

        transform:
            translateY(0)
            scale(1);

        letter-spacing:-5px;
    }
}


@keyframes titleBreathing{

    0%,
    100%{

        transform:
            scale(1);

        text-shadow:
            0 0 15px rgba(255,255,255,.04);
    }

    50%{

        transform:
            scale(1.012);

        text-shadow:
            0 0 30px rgba(255,255,255,.14);
    }
}


@keyframes textShine{

    0%{

        background-position:
            200% center;
    }

    45%,
    100%{

        background-position:
            -100% center;
    }
}


@keyframes subtitleReveal{

    from{

        opacity:0;

        filter:blur(8px);

        transform:
            translateY(25px);

        letter-spacing:12px;
    }

    to{

        opacity:1;

        filter:blur(0);

        transform:
            translateY(0);

        letter-spacing:6px;
    }
}


@keyframes lineGrow{

    from{
        width:0;
    }

    to{
        width:190px;
    }
}


@keyframes loadingFade{

    from{

        opacity:0;

        transform:
            translateY(12px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


@keyframes progressLoad{

    from{
        width:0;
    }

    to{
        width:100%;
    }
}


@keyframes progressShine{

    from{
        left:-80px;
    }

    to{
        left:100%;
    }
}


/* =========================================================
   STAR MOVEMENT
========================================================= */

@keyframes starsDrift{

    0%{

        transform:
            translate3d(0,0,0);
    }

    50%{

        transform:
            translate3d(-35px,45px,0);
    }

    100%{

        transform:
            translate3d(0,90px,0);
    }
}


@keyframes starsDriftReverse{

    0%{

        transform:
            translate3d(0,0,0);
    }

    50%{

        transform:
            translate3d(30px,-40px,0);
    }

    100%{

        transform:
            translate3d(0,-80px,0);
    }
}


@keyframes starTwinkle{

    0%{

        opacity:.25;

        transform:
            scale(.9);
    }

    100%{

        opacity:.75;

        transform:
            scale(1.08);
    }
}


/* =========================================================
   SPACE LIGHT
========================================================= */

@keyframes spacePulse{

    0%,
    100%{

        opacity:.35;

        transform:
            translate(-50%,-50%)
            scale(.95);
    }

    50%{

        opacity:.7;

        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}


/* =========================================================
   SIMPLE FADE
========================================================= */

@keyframes simpleFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


/* =========================================================
   EXIT
========================================================= */

@keyframes exitScreen{

    0%{

        opacity:1;

        transform:
            scale(1);
    }

    70%{

        opacity:1;

        transform:
            scale(1.025);
    }

    100%{

        opacity:0;

        transform:
            scale(1.08);

        visibility:hidden;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .small-text{

        font-size:8px;

        letter-spacing:5px;

        margin-bottom:22px;
    }


    .title{

        font-size:40px;

        letter-spacing:-3px;
    }


    .subtitle{

        font-size:8px;

        letter-spacing:3px;

        line-height:1.8;
    }


    .loading-text{

        font-size:8px;

        letter-spacing:3px;
    }


    .progress{

        width:220px;
    }


    .corner{

        width:30px;

        height:30px;
    }


    .corner.top-left,
    .corner.top-right{

        top:20px;
    }


    .corner.bottom-left,
    .corner.bottom-right{

        bottom:20px;
    }


    .corner.top-left,
    .corner.bottom-left{

        left:20px;
    }


    .corner.top-right,
    .corner.bottom-right{

        right:20px;
    }


    .top-info{

        top:22px;

        font-size:7px;

        letter-spacing:3px;
    }


    .bottom-info{

        bottom:22px;

        font-size:7px;

        letter-spacing:2px;
    }

}


@media(max-width:400px){

    .title{

        font-size:32px;
    }


    .subtitle{

        font-size:7px;
    }


    .progress{

        width:180px;
    }

}

</style>

</head>


<body>


<section
    class="loading-screen"
    id="loadingScreen"
>


    <!-- =====================================================
         SPACE
    ====================================================== -->

    <div class="space">

        <div class="stars"></div>

        <div class="stars-2"></div>

        <div class="stars-3"></div>

        <div class="space-light"></div>

    </div>


    <!-- =====================================================
         VIGNETTE
    ====================================================== -->

    <div class="vignette"></div>


    <!-- =====================================================
         CORNERS
    ====================================================== -->

    <div class="corner top-left"></div>

    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>

    <div class="corner bottom-right"></div>


    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="top-info">

        PORTFOLIO • 2026

    </div>


    <!-- =====================================================
         CENTER
    ====================================================== -->

    <div class="loading-content">


        <div class="small-text">

            WARANCHIT WONGSUPALERD

        </div>


        <div class="title">

            WELCOME TO

            <span>

                MY PORTFOLIO

            </span>

        </div>


        <div class="subtitle">

            WELCOME TO MY PORTFOLIO WEBSITE

        </div>


        <div class="line"></div>


        <div class="loading-text">

            LOADING PORTFOLIO

        </div>


        <div class="progress"></div>


        <div class="percent">

            PLEASE WAIT...

        </div>


    </div>


    <!-- =====================================================
         BOTTOM
    ====================================================== -->

    <div class="bottom-info">

        WARANCHIT © 2026

    </div>


</section>


<script>

/* =========================================================
   LOADING SYSTEM
========================================================= */

const loadingScreen =
    document.getElementById("loadingScreen");


/*
    เริ่ม Transition
*/

setTimeout(() => {

    loadingScreen.classList.add("exit");

}, 5900);


/*
    ไปหน้า Portfolio
*/

setTimeout(() => {

    window.location.href =
        "portfolio.html";

}, 7100);

</script>


</body>

</html>
