<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading | Waranchit Portfolio</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#000;

    color:#fff;

    overflow:hidden;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.08),
            transparent 18%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(100,100,255,.04),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(255,255,255,.035),
            transparent 30%
        ),

        #000;

    overflow:hidden;

    isolation:isolate;

    perspective:1000px;
}


/* =========================================================
   STAR FIELD
========================================================= */

.stars{

    position:absolute;

    inset:-100px;

    background-image:

        radial-gradient(1px 1px at 5% 10%,#fff,transparent),
        radial-gradient(1px 1px at 15% 40%,#fff,transparent),
        radial-gradient(1px 1px at 25% 80%,#fff,transparent),
        radial-gradient(1px 1px at 35% 20%,#fff,transparent),
        radial-gradient(1px 1px at 45% 65%,#fff,transparent),
        radial-gradient(1px 1px at 55% 15%,#fff,transparent),
        radial-gradient(1px 1px at 65% 85%,#fff,transparent),
        radial-gradient(1px 1px at 75% 45%,#fff,transparent),
        radial-gradient(1px 1px at 85% 10%,#fff,transparent),
        radial-gradient(1px 1px at 95% 70%,#fff,transparent);

    background-size:320px 320px;

    opacity:.65;

    animation:
        starsMove 35s linear infinite;

    z-index:-10;
}


/* SECOND STAR LAYER */

.stars::after{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        radial-gradient(2px 2px at 12% 30%,rgba(255,255,255,.8),transparent),
        radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,.7),transparent),
        radial-gradient(2px 2px at 48% 25%,rgba(255,255,255,.8),transparent),
        radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 90% 35%,rgba(255,255,255,.7),transparent);

    background-size:500px 500px;

    animation:
        starsMoveReverse 50s linear infinite;

    opacity:.45;
}


/* =========================================================
   BLACK HOLE
========================================================= */

.black-hole{

    position:absolute;

    width:420px;

    height:420px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:-3;

    pointer-events:none;

    animation:
        blackHoleFloat 8s ease-in-out infinite;
}


/* =========================================================
   OUTER GRAVITY GLOW
========================================================= */

.black-hole::before{

    content:"";

    position:absolute;

    inset:-90px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.08) 0%,
            rgba(255,255,255,.025) 35%,
            transparent 70%
        );

    filter:blur(15px);

    animation:
        gravityPulse 4s ease-in-out infinite;
}


/* =========================================================
   ACCRETION DISK
========================================================= */

.accretion-disk{

    position:absolute;

    width:100%;

    height:100%;

    border-radius:50%;

    background:

        radial-gradient(
            ellipse,
            transparent 0%,
            transparent 24%,

            rgba(255,255,255,.95) 25%,
            rgba(255,255,255,.35) 30%,

            rgba(255,255,255,.08) 39%,

            transparent 52%
        );

    transform:
        rotateX(68deg)
        rotateZ(-15deg);

    filter:
        blur(.3px)
        drop-shadow(
            0 0 20px
            rgba(255,255,255,.4)
        );

    animation:
        diskRotate 8s linear infinite;
}


/* =========================================================
   INNER DISK
========================================================= */

.accretion-disk::before{

    content:"";

    position:absolute;

    inset:45px;

    border-radius:50%;

    background:

        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,255,255,.7),
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    filter:blur(5px);

    animation:
        diskRotateReverse 4s linear infinite;
}


/* =========================================================
   EVENT HORIZON
========================================================= */

.event-horizon{

    position:absolute;

    width:145px;

    height:145px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#000;

    box-shadow:

        0 0 20px #000,

        0 0 50px rgba(0,0,0,.9),

        0 0 90px rgba(255,255,255,.15);

    z-index:3;

    animation:
        horizonPulse 4s ease-in-out infinite;
}


/* =========================================================
   GRAVITY WAVES
========================================================= */

.gravity-wave{

    position:absolute;

    left:50%;

    top:50%;

    width:220px;

    height:220px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    animation:
        gravityWave 5s ease-out infinite;
}


.gravity-wave:nth-child(2){

    animation-delay:1.6s;
}


.gravity-wave:nth-child(3){

    animation-delay:3.2s;
}


/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting-stars{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;
}


.shooting-star{

    position:absolute;

    width:220px;

    height:1px;

    opacity:0;

    transform:
        rotate(-35deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            rgba(255,255,255,.7),
            #fff
        );

    box-shadow:
        0 0 10px rgba(255,255,255,.8);

    animation:
        shootingStar 6s cubic-bezier(.2,.7,.2,1) infinite;
}


/* STAR POSITIONS */

.shooting-star:nth-child(1){
    top:5%;
    left:3%;
    animation-delay:0s;
}

.shooting-star:nth-child(2){
    top:18%;
    left:50%;
    animation-delay:1.5s;
}

.shooting-star:nth-child(3){
    top:8%;
    left:80%;
    animation-delay:3s;
}

.shooting-star:nth-child(4){
    top:42%;
    left:90%;
    animation-delay:4.5s;
}

.shooting-star:nth-child(5){
    top:70%;
    left:5%;
    animation-delay:6s;
}

.shooting-star:nth-child(6){
    top:82%;
    left:55%;
    animation-delay:7.5s;
}

.shooting-star:nth-child(7){
    top:50%;
    left:25%;
    animation-delay:9s;
}

.shooting-star:nth-child(8){
    top:90%;
    left:80%;
    animation-delay:11s;
}


/* =========================================================
   GRID
========================================================= */

.grid{

    position:absolute;

    inset:-50%;

    background:

        linear-gradient(
            90deg,
            transparent 49.5%,
            rgba(255,255,255,.035) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            transparent 49.5%,
            rgba(255,255,255,.035) 50%,
            transparent 50.5%
        );

    background-size:
        100px 100px;

    mask-image:

        radial-gradient(
            ellipse at center,
            black 0%,
            transparent 65%
        );

    opacity:.5;

    transform:
        perspective(500px)
        rotateX(65deg);

    animation:
        gridMove 18s linear infinite;

    pointer-events:none;

    z-index:-6;
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.35) 65%,
            rgba(0,0,0,.9) 100%
        );

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   NOISE
========================================================= */

.noise{

    position:absolute;

    inset:0;

    opacity:.025;

    pointer-events:none;

    background-image:

        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");

    z-index:10;
}


/* =========================================================
   CENTER CONTENT
========================================================= */

.loading-content{

    position:relative;

    z-index:5;

    width:90%;

    max-width:1100px;

    text-align:center;

    transform:
        translateZ(0);
}


/* =========================================================
   SMALL TEXT
========================================================= */

.small-text{

    font-size:11px;

    letter-spacing:8px;

    color:#888;

    margin-bottom:28px;

    opacity:0;

    animation:
        fadeUp 1s ease .3s forwards;
}


/* =========================================================
   TITLE
========================================================= */

.title{

    font-size:

        clamp(
            44px,
            8vw,
            105px
        );

    font-weight:700;

    line-height:.92;

    letter-spacing:-5px;

    text-transform:uppercase;

    opacity:0;

    animation:

        titleReveal 1.4s
        cubic-bezier(.16,1,.3,1)
        .6s
        forwards;
}


.title span{

    display:block;

    color:transparent;

    -webkit-text-stroke:
        1px rgba(255,255,255,.9);

    text-shadow:

        0 0 20px rgba(255,255,255,.08),

        0 0 50px rgba(255,255,255,.05);

    animation:
        titleGlow 4s ease-in-out infinite;
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin-top:32px;

    font-size:12px;

    letter-spacing:6px;

    color:#999;

    text-transform:uppercase;

    opacity:0;

    animation:
        fadeUp 1s ease 1.8s forwards;
}


/* =========================================================
   LINE
========================================================= */

.line{

    width:0;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #fff,
            transparent
        );

    margin:
        35px auto 30px;

    box-shadow:
        0 0 15px rgba(255,255,255,.7);

    animation:
        lineGrow 1.3s ease 2.3s forwards;
}


/* =========================================================
   LOADING TEXT
========================================================= */

.loading-text{

    font-size:10px;

    letter-spacing:5px;

    color:#666;

    text-transform:uppercase;

    opacity:0;

    animation:
        fadeIn .8s ease 2.6s forwards;
}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress{

    width:280px;

    max-width:70%;

    height:2px;

    background:

        linear-gradient(
            90deg,
            #111,
            #222
        );

    margin:
        18px auto 0;

    overflow:hidden;

    position:relative;

    opacity:0;

    animation:
        fadeIn .8s ease 2.6s forwards;
}


.progress::after{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:0;

    height:100%;

    background:#fff;

    box-shadow:
        0 0 18px rgba(255,255,255,1);

    animation:

        loading 3.2s
        cubic-bezier(.4,0,.2,1)
        2.7s
        forwards;
}


/* MOVING LIGHT */

.progress::before{

    content:"";

    position:absolute;

    top:0;

    left:-100px;

    width:80px;

    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    animation:
        progressLight 2s linear infinite;
}


/* =========================================================
   PERCENT
========================================================= */

.percent{

    margin-top:15px;

    font-size:9px;

    color:#555;

    letter-spacing:4px;

    opacity:0;

    animation:
        fadeIn .8s ease 2.6s forwards;
}


/* =========================================================
   CORNERS
========================================================= */

.corner{

    position:absolute;

    width:48px;

    height:48px;

    border-color:#444;

    border-style:solid;

    opacity:.65;

    z-index:6;

    transition:
        all .5s ease;
}


.corner.top-left{

    top:30px;
    left:30px;

    border-width:
        1px 0 0 1px;
}


.corner.top-right{

    top:30px;
    right:30px;

    border-width:
        1px 1px 0 0;
}


.corner.bottom-left{

    bottom:30px;
    left:30px;

    border-width:
        0 0 1px 1px;
}


.corner.bottom-right{

    bottom:30px;
    right:30px;

    border-width:
        0 1px 1px 0;
}


.corner:hover{

    width:60px;

    height:60px;

    border-color:#fff;

    filter:
        drop-shadow(
            0 0 8px #fff
        );
}


/* =========================================================
   TOP INFO
========================================================= */

.top-info{

    position:absolute;

    top:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:6px;

    color:#444;

    z-index:6;

    white-space:nowrap;
}


/* =========================================================
   BOTTOM INFO
========================================================= */

.bottom-info{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:4px;

    color:#444;

    white-space:nowrap;

    z-index:6;
}


/* =========================================================
   EXIT
========================================================= */

.loading-screen.exit{

    animation:

        exitScreen
        1.2s
        cubic-bezier(.76,0,.24,1)
        forwards;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(30px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


@keyframes titleReveal{

    from{

        opacity:0;

        transform:
            translateY(70px)
            scale(.96);

        letter-spacing:18px;
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        letter-spacing:-5px;
    }
}


@keyframes titleGlow{

    0%,
    100%{

        text-shadow:
            0 0 20px
            rgba(255,255,255,.05);
    }

    50%{

        text-shadow:

            0 0 30px
            rgba(255,255,255,.16),

            0 0 70px
            rgba(255,255,255,.07);
    }
}


@keyframes lineGrow{

    from{
        width:0;
    }

    to{
        width:190px;
    }
}


@keyframes loading{

    from{
        width:0;
    }

    to{
        width:100%;
    }
}


@keyframes progressLight{

    0%{
        left:-100px;
    }

    100%{
        left:100%;
    }
}


/* =========================================================
   STAR ANIMATION
========================================================= */

@keyframes starsMove{

    0%{
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50%{
        transform:
            translate3d(-40px,60px,0)
            scale(1.02);
    }

    100%{
        transform:
            translate3d(0,120px,0)
            scale(1);
    }
}


@keyframes starsMoveReverse{

    from{
        transform:
            translateY(0);
    }

    to{
        transform:
            translateY(-160px);
    }
}


/* =========================================================
   BLACK HOLE ANIMATION
========================================================= */

@keyframes blackHoleFloat{

    0%,
    100%{

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{

        transform:
            translate(-50%,-50%)
            scale(1.035);
    }
}


@keyframes gravityPulse{

    0%,
    100%{

        opacity:.4;

        transform:
            scale(.9);
    }

    50%{

        opacity:.9;

        transform:
            scale(1.05);
    }
}


@keyframes diskRotate{

    from{

        transform:
            rotateX(68deg)
            rotateZ(0deg);
    }

    to{

        transform:
            rotateX(68deg)
            rotateZ(360deg);
    }
}


@keyframes diskRotateReverse{

    from{

        transform:
            rotate(0deg);
    }

    to{

        transform:
            rotate(-360deg);
    }
}


@keyframes horizonPulse{

    0%,
    100%{

        box-shadow:

            0 0 20px #000,

            0 0 50px rgba(0,0,0,.9),

            0 0 90px rgba(255,255,255,.12);
    }

    50%{

        box-shadow:

            0 0 25px #000,

            0 0 70px rgba(0,0,0,1),

            0 0 110px rgba(255,255,255,.2);
    }
}


@keyframes gravityWave{

    0%{

        width:160px;

        height:160px;

        opacity:.5;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    100%{

        width:700px;

        height:700px;

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   SHOOTING STAR ANIMATION
========================================================= */

@keyframes shootingStar{

    0%{

        opacity:0;

        transform:
            translate(0,0)
            rotate(-35deg)
            scaleX(.2);
    }

    5%{

        opacity:1;

        transform:
            translate(50px,50px)
            rotate(-35deg)
            scaleX(1);
    }

    25%{

        opacity:.9;
    }

    45%{

        opacity:0;

        transform:
            translate(700px,700px)
            rotate(-35deg)
            scaleX(1.2);
    }

    100%{

        opacity:0;

        transform:
            translate(700px,700px)
            rotate(-35deg);
    }
}


/* =========================================================
   GRID ANIMATION
========================================================= */

@keyframes gridMove{

    from{

        background-position:
            0 0;
    }

    to{

        background-position:
            0 100px;
    }
}


/* =========================================================
   EXIT ANIMATION
========================================================= */

@keyframes exitScreen{

    0%{

        opacity:1;

        transform:
            scale(1);
    }

    70%{

        opacity:1;

        transform:
            scale(1.03);
    }

    100%{

        opacity:0;

        transform:
            scale(1.1);

        visibility:hidden;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .black-hole{

        width:280px;

        height:280px;
    }


    .event-horizon{

        width:100px;

        height:100px;
    }


    .small-text{

        font-size:8px;

        letter-spacing:5px;

        margin-bottom:22px;
    }


    .title{

        font-size:40px;

        letter-spacing:-3px;
    }


    .subtitle{

        font-size:8px;

        letter-spacing:3px;

        line-height:1.8;
    }


    .loading-text{

        font-size:8px;

        letter-spacing:3px;
    }


    .progress{

        width:220px;
    }


    .corner{

        width:30px;

        height:30px;
    }


    .corner:hover{

        width:30px;

        height:30px;
    }


    .corner.top-left,
    .corner.top-right{

        top:20px;
    }


    .corner.bottom-left,
    .corner.bottom-right{

        bottom:20px;
    }


    .corner.top-left,
    .corner.bottom-left{

        left:20px;
    }


    .corner.top-right,
    .corner.bottom-right{

        right:20px;
    }


    .top-info{

        top:22px;

        font-size:7px;

        letter-spacing:3px;
    }


    .bottom-info{

        bottom:22px;

        font-size:7px;

        letter-spacing:2px;
    }


    .shooting-star{

        width:130px;
    }


    .gravity-wave{

        width:150px;

        height:150px;
    }

}


@media(max-width:400px){

    .black-hole{

        width:230px;

        height:230px;
    }


    .event-horizon{

        width:80px;

        height:80px;
    }


    .title{

        font-size:32px;

        letter-spacing:-2px;
    }


    .subtitle{

        font-size:7px;
    }


    .progress{

        width:180px;
    }

}

</style>

</head>
